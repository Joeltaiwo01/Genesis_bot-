name: dyor-scan
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write config from secret
        run: echo '${{ secrets.CONFIG_JSON }}' > config.json
      - name: Run scan
        env:
          MODE: cron
        run: python bot.py
      - name: Save state
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git commit -m "state" || echo "no changes"
          git push
